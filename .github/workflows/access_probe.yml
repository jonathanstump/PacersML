name: Access probe

# Manual trigger only: Actions tab -> "Access probe" -> Run workflow.
# Run it 3 times a few hours apart; each run uploads its JSON as an artifact
# and prints a results table in the run summary.
on:
  workflow_dispatch:
  # Week-one probe runs 2 and 3 (D4): 2026-10-20 at 08:30 and 15:30 UTC.
  # Remove after they have run, or these fire again next Oct 20.
  schedule:
    - cron: "30 8 20 10 *"
    - cron: "30 15 20 10 *"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_endpoints.py --label github-actions
      - uses: actions/upload-artifact@v4
        with:
          name: access-probe-${{ github.run_id }}
          path: reports/access_probe/*.json
